services:
  - type: web
    name: secopsai-edge-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt -r agent/requirements.txt
    startCommand: ./scripts/render-start-api
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secopsai-edge-postgres
          property: connectionString
      - key: SECOPSAI_AUTO_CREATE_TABLES
        value: "false"
      - key: SECOPSAI_CORS_ORIGINS
        sync: false
      - key: SECOPSAI_ADMIN_TOKEN
        sync: false
      - key: SECOPSAI_TOKEN_SECRET
        generateValue: true
      - key: SECOPSAI_DASHBOARD_SESSION_TTL_SECONDS
        value: "28800"
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.4-mini
      - key: SPLUNK_HEC_ENABLED
        value: "false"

databases:
  - name: secopsai-edge-postgres
    databaseName: secopsai_edge
    user: secopsai
    plan: free
