services:
  - type: web
    name: secopsai-edge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: ./scripts/render-start-api
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secopsai-edge-postgres
          property: connectionString
      - key: SECOPSAI_AUTO_CREATE_TABLES
        value: "false"
      - key: SECOPSAI_ENVIRONMENT
        value: "pilot"
      - key: SECOPSAI_CORS_ORIGINS
        sync: false
      - key: SECOPSAI_ADMIN_TOKEN
        sync: false
      - key: SECOPSAI_DASHBOARD_ADMIN_EMAIL
        sync: false
      - key: SECOPSAI_DASHBOARD_ADMIN_PASSWORD
        sync: false
      - key: SECOPSAI_TOKEN_SECRET
        generateValue: true
      - key: SECOPSAI_DASHBOARD_SESSION_TTL_SECONDS
        value: "28800"
      - key: SECOPSAI_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: SECOPSAI_LOGIN_LOCKOUT_SECONDS
        value: "900"
      - key: SECOPSAI_DASHBOARD_RESET_URL
        sync: false
      - key: SECOPSAI_PASSWORD_RESET_TTL_SECONDS
        value: "1800"
      - key: SECOPSAI_PASSWORD_RESET_COOLDOWN_SECONDS
        value: "60"
      - key: SECOPSAI_PASSWORD_RESET_MAX_DELIVERY_ATTEMPTS
        value: "4"
      - key: SECOPSAI_WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: SECOPSAI_NOTIFICATION_MAX_ATTEMPTS
        value: "4"
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.4-mini
      - key: SPLUNK_HEC_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
  - type: cron
    name: secopsai-edge-scheduler
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.lock
    startCommand: ./scripts/render-run-due-schedules
    envVars:
      - key: SECOPSAI_EDGE_API_HOSTPORT
        fromService:
          name: secopsai-edge-api
          type: web
          property: hostport
      - key: SECOPSAI_ADMIN_TOKEN
        fromService:
          name: secopsai-edge-api
          type: web
          envVarKey: SECOPSAI_ADMIN_TOKEN

databases:
  - name: secopsai-edge-postgres
    databaseName: secopsai_edge
    user: secopsai
    plan: free
