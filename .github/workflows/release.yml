name: Release Sensor Package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install locked release dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock pip-audit
          npm ci --prefix web
          (cd web && npx playwright install --with-deps chromium)

      - name: Verify exact release commit
        run: |
          ./scripts/release-gate
          .venv/bin/pip-audit -r requirements.lock

      - name: Build versioned package
        run: |
          chmod 755 scripts/build-release scripts/bootstrap-secopsai-edge.sh
          ./scripts/build-release "${GITHUB_REF_NAME#v}" dist
          cp "dist/secopsai-edge-${GITHUB_REF_NAME#v}.tar.gz" dist/secopsai-edge.tar.gz
          (cd dist && shasum -a 256 secopsai-edge.tar.gz > secopsai-edge.tar.gz.sha256)

      - name: Attest package provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "dist/*.tar.gz"

      - name: Record private repository provenance limitation
        if: ${{ github.event.repository.private }}
        run: echo "::notice::GitHub artifact attestations are unavailable for user-owned private repositories; publishing SHA-256 manifests from the verified tag workflow."

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/secopsai-edge-${GITHUB_REF_NAME#v}.tar.gz"
            "dist/secopsai-edge-${GITHUB_REF_NAME#v}.tar.gz.sha256"
            "dist/secopsai-edge.tar.gz"
            "dist/secopsai-edge.tar.gz.sha256"
            "dist/bootstrap-secopsai-edge.sh"
          )
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refreshing verified assets."
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
          fi
